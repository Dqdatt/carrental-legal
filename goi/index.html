<style>
/* Trang chọn gói và thanh toán chuyển khoản (docs/PAYMENT_PLAN.md mục 6). Màu, chữ theo app (Palette.swift). */
:root {
  --canvas: #F4F6FA; --surface: #FFFFFF; --surface-2: #EEF2F7; --surface-3: #E2E8F0;
  --ink: #0F172A; --ink-2: #64748B; --ink-3: #94A3B8; --line: #E6EBF2;
  --primary: #2563EB; --on-primary: #FFFFFF; --accent-2: #DBEAFE; --brand: #0F61F5;
  --ok: #16A34A; --wait: #D97706; --bad: #DC2626;
  --shadow: 0 1px 2px rgba(15,23,42,.04), 0 6px 20px rgba(15,23,42,.05);
  --font: "Manrope", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --canvas: #0B1120; --surface: #111827; --surface-2: #1E293B; --surface-3: #334155;
  --ink: #F1F5F9; --ink-2: #94A3B8; --ink-3: #64748B; --line: #1E293B;
  --primary: #3B82F6; --accent-2: #1E3A8A; --ok: #22C55E; --wait: #F59E0B; --bad: #F87171;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --canvas: #0B1120; --surface: #111827; --surface-2: #1E293B; --surface-3: #334155;
  --ink: #F1F5F9; --ink-2: #94A3B8; --ink-3: #64748B; --line: #1E293B;
  --primary: #3B82F6; --accent-2: #1E3A8A; --ok: #22C55E; --wait: #F59E0B; --bad: #F87171;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--canvas); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
[hidden] { display: none !important; }
.wrap { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 20px) 16px calc(env(safe-area-inset-bottom, 0px) + 40px); }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
.brand > svg { width: 30px; height: auto; color: var(--brand); }
.pw { position: relative; }
.pw .input { padding-right: 46px; }
.pw-eye { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; color: var(--ink-3); background: none; border: 0; cursor: pointer; }
.pw-eye:hover { color: var(--ink-2); }
.pw-eye svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.theme-btn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); box-shadow: var(--shadow); color: var(--ink-2); flex: none; cursor: pointer; }
.theme-btn:hover { color: var(--ink); }
.theme-btn svg { width: 18px; height: 18px; color: inherit; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.brand b { font-size: 17px; font-weight: 700; letter-spacing: -.02em; } .brand b span { color: var(--primary); }
h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -.02em; text-wrap: balance; }
h2 { margin: 0 0 10px; font-size: 16px; font-weight: 600; }
.sub { color: var(--ink-2); font-size: 14px; margin: 4px 0 0; text-wrap: pretty; }
.card { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 18px; }
.gap { margin-top: 16px; }
.muted { color: var(--ink-2); } .faint { color: var(--ink-3); } .small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: var(--ink-3); flex: none; }
.dot.ok { background: var(--ok); } .dot.wait { background: var(--wait); } .dot.bad { background: var(--bad); } .dot.info { background: var(--primary); }
.st { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; color: var(--ink-2); }
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
.input { height: 48px; border-radius: 14px; border: 0; box-shadow: inset 0 0 0 1.5px var(--line); background: var(--surface); padding: 0 14px; outline: none; width: 100%; font-size: 16px; }
.input:focus { box-shadow: inset 0 0 0 1.5px var(--ink); }
.btn { height: 50px; width: 100%; border-radius: 14px; font-weight: 600; font-size: 15.5px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--primary); color: var(--on-primary); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.line { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--surface-3); }
.err { color: var(--bad); font-size: 13.5px; min-height: 20px; margin: 4px 0 8px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { height: 38px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--ink-2); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.seg small { font-weight: 500; color: var(--ink-3); margin-left: 6px; }
.plans { display: grid; gap: 10px; margin-top: 12px; }
.plan { display: grid; grid-template-columns: 22px 1fr auto; column-gap: 12px; row-gap: 6px; align-items: start; text-align: left; width: 100%; padding: 16px; border-radius: 16px; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line); }
.plan.on { box-shadow: inset 0 0 0 2px var(--primary); }
.radio { width: 20px; height: 20px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--surface-3); margin-top: 2px; }
.plan.on .radio { box-shadow: inset 0 0 0 6px var(--primary); }
.plan b { font-size: 16px; font-weight: 600; }
.plan .tag { display: inline-block; font-size: 11.5px; font-weight: 600; color: var(--ink-2); background: var(--surface-2); border-radius: 999px; padding: 2px 8px; margin-top: 4px; white-space: nowrap; }
.plan .cars { display: block; font-size: 13px; font-weight: 600; color: var(--ink); margin-top: 1px; }
.plan .price { text-align: right; font-weight: 700; font-size: 17px; white-space: nowrap; }
.plan .price small { display: block; font-size: 12px; font-weight: 500; color: var(--ink-3); }
.plan .desc { grid-column: 2 / 4; font-size: 13px; color: var(--ink-2); text-wrap: pretty; }
/* Vé: khối tiền, mã QR (đường cắt đứt nét, khuyết tròn hai bên) */
.ticket { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); }
.tk { padding: 16px 18px; }
.cut { position: relative; height: 0; margin: 2px 18px; border-top: 1.5px dashed color-mix(in srgb, var(--ink-3) 55%, transparent); }
.cut::before, .cut::after { content: ""; position: absolute; top: -12px; width: 22px; height: 22px; border-radius: 50%; background: var(--canvas); }
.cut::before { left: -30px; } .cut::after { right: -30px; }
.kv { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 6px 0; font-size: 14px; }
.kv > span:first-child { color: var(--ink-2); }
.kv > span:last-child { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.kv .note { display: block; font-size: 12.5px; color: var(--ink-3); font-weight: 500; }
.total { font-size: 22px; font-weight: 700; }
.qr { display: grid; place-items: center; padding: 6px 0 4px; }
.qr img { width: min(280px, 100%); aspect-ratio: 1; border-radius: 12px; background: #fff; padding: 8px; }
.copy { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.copy:first-of-type { border-top: 0; }
.copy .l { font-size: 12.5px; color: var(--ink-2); }
.copy .v { font-weight: 600; font-variant-numeric: tabular-nums; word-break: break-all; }
.copy .v.code { font-size: 18px; letter-spacing: .04em; color: var(--primary); }
.copy button { flex: none; height: 32px; padding: 0 12px; border-radius: 10px; background: var(--surface-2); font-weight: 600; font-size: 13px; }
.steps { margin: 0; padding-left: 20px; color: var(--ink-2); font-size: 13.5px; }
.steps li { margin: 3px 0; }
.wait { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-2); }
.pulse { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.done-ic { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); margin-bottom: 14px; }
.foot { font-size: 12.5px; color: var(--ink-3); margin-top: 22px; line-height: 1.55; }
.foot a { color: var(--ink-2); }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translate(-50%, 20px); opacity: 0; background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; transition: .25s; pointer-events: none; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<script>
/* Kết nối: Edge Function pay-api (supabase/functions/pay-api). Mở bằng link có mã riêng (?t=…) hoặc đăng nhập như app. */
const SB_URL = 'https://epiapzuitzwkexndmvbp.supabase.co';
const SB_KEY = 'sb_publishable_BATsaw6NBY3k6zo9tO2pNw_uOJ0Z9gB';
const API = SB_URL + '/functions/v1/pay-api';

const BANKS = { '970436': 'Vietcombank', '970407': 'Techcombank', '970422': 'MB Bank', '970416': 'ACB', '970418': 'BIDV', '970415': 'VietinBank', '970432': 'VPBank', '970423': 'TPBank', '970403': 'Sacombank', '970405': 'Agribank' };
const ERR = {
  link_expired: 'Link đã hết hạn hoặc không đúng. Đăng nhập để tiếp tục.', login_required: 'Đăng nhập để chọn gói.', locked: 'Tài khoản đang tạm khoá. Liên hệ hỗ trợ.',

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const money = n => String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + 'đ';
const pad2 = n => String(n).padStart(2, '0');
const D = s => s ? new Date(s) : null;
const fDate = d => (d = D(d)) ? `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}/${d.getFullYear()}` : '';

const ss = { get(k) { try { return JSON.parse(sessionStorage.getItem(k)); } catch { return null; } }, set(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, JSON.stringify(v)); } catch {} } };

const S = { token: new URLSearchParams(location.search).get('t'), session: ss.get('cr-pay-session'), info: null, plan: 'basic', period: 'month', quote: null, order: null, poll: null };
const errText = e => ERR[e?.message] || e?.message || 'Có lỗi, thử lại.';

async function api(action, extra = {}) {
  const headers = { 'Content-Type': 'application/json', apikey: SB_KEY };
  if (!S.token && S.session) headers.Authorization = `Bearer ${S.session.access_token}`;
  let r;
  try { r = await fetch(API, { method: 'POST', headers, body: JSON.stringify({ action, t: S.token || undefined, ...extra }) }); }
  catch { throw new Error('network'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `Lỗi ${r.status}`);
  return j;
}

/* Nút mắt hiện/ẩn mật khẩu: gắn vào mọi ô mật khẩu trong vùng vừa vẽ */
const EYE = { show: '<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>', hide: '<path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/>' };
function eyeify(root = document) {
  root.querySelectorAll('input[type="password"]:not([data-eye])').forEach(inp => {
    inp.dataset.eye = '1';
    const wrap = document.createElement('div'); wrap.className = 'pw';
    inp.replaceWith(wrap); wrap.appendChild(inp);
    const b = document.createElement('button'); b.type = 'button'; b.className = 'pw-eye';
    const paint = () => { const shown = inp.type === 'text'; b.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${shown ? EYE.hide : EYE.show}</svg>`;
      b.setAttribute('aria-label', shown ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'); b.title = b.getAttribute('aria-label'); };
    b.addEventListener('click', () => { inp.type = inp.type === 'password' ? 'text' : 'password'; paint(); inp.focus(); });
    paint(); wrap.appendChild(b);
  });
}

/* ---------- đăng nhập (cùng tài khoản app: email hoặc số điện thoại + mật khẩu) ---------- */
function loginEmail(v) {
  v = v.trim().toLowerCase();
  if (/[a-z@]/.test(v)) return v;
  let d = v.replace(/\D/g, '');
  if (d.startsWith('0')) d = '84' + d.slice(1);
  return `${d}@phone.example.com`;
}
function showLogin(msg) {
  stopPoll();
  $('#app').innerHTML = `<h1>Chọn gói</h1><p class="sub">Đăng nhập bằng tài khoản CarRental để xem và đăng ký gói.</p>
    <form class="card gap" id="login" autocomplete="on">
      <div class="field"><label for="lg-id">Email hoặc số điện thoại</label><input class="input" id="lg-id" autocomplete="username" required></div>
      <div class="field"><label for="lg-pw">Mật khẩu</label><input class="input" id="lg-pw" type="password" autocomplete="current-password" required></div>
      <div class="err" id="lg-err">${esc(msg || '')}</div>
      <button class="btn" id="lg-btn" type="submit">Đăng nhập</button>
      <p class="small faint" style="margin:12px 0 0">Quên mật khẩu: dùng "Quên mật khẩu" trong app CarRental.</p>
    </form>`;
  eyeify($('#login'));
  $('#login').addEventListener('submit', async e => {
    e.preventDefault();
    const b = $('#lg-btn'); b.disabled = true; b.textContent = 'Đang đăng nhập…'; $('#lg-err').textContent = '';
    try {
      const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=password`, { method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: loginEmail($('#lg-id').value), password: $('#lg-pw').value }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error_code || 'invalid_credentials');
      S.session = { access_token: j.access_token }; ss.set('cr-pay-session', S.session); S.token = null;
      await start();
    } catch (err) { $('#lg-err').textContent = errText(err); b.disabled = false; b.textContent = 'Đăng nhập'; }
  });
}

/* ---------- chọn gói ---------- */
const price = (plan, period) => S.info.prices.find(p => p.plan === plan && p.period === period)?.amount ?? 0;
function statusLine() {
  const i = S.info, now = Date.now();
  if (i.plan !== 'free' && D(i.paid_until) > now) return `<span class="st"><i class="dot ok"></i>Gói ${PLANS[i.plan]?.name || ''} đến ${fDate(i.paid_until)}${i.next_plan ? `, sau đó gói ${PLANS[i.next_plan]?.name} đến ${fDate(i.next_until)}` : ''}</span>`;
  if (i.plan !== 'free' && D(i.trial_end) > now) return `<span class="st"><i class="dot wait"></i>Đang dùng thử gói ${PLANS[i.plan]?.name || ''} đến ${fDate(i.trial_end)}</span>`;
  return `<span class="st"><i class="dot"></i>Đang dùng gói Miễn phí (tối đa 2 xe)</span>`;
}
function showChoose() {
  stopPoll();
  const i = S.info, saved = m => Math.round(100 - price('basic', 'year') / (price('basic', 'month') * 12) * 100);
  $('#app').innerHTML = `<h1>${i.name ? `Chào ${esc(i.name)}` : 'Chọn gói'}</h1><p class="sub">${statusLine()}</p>
    <div class="card gap">
      <div class="seg" role="tablist" aria-label="Kỳ hạn"><button data-period="month" class="${S.period === 'month' ? 'on' : ''}">Theo tháng</button><button data-period="year" class="${S.period === 'year' ? 'on' : ''}">Theo năm${saved() > 0 ? `<small>bớt ${saved()}%</small>` : ''}</button></div>
      <div class="plans">${Object.entries(PLANS).map(([k, p]) => `<button class="plan ${S.plan === k ? 'on' : ''}" data-plan="${k}" aria-pressed="${S.plan === k}">
        <span class="radio"></span><span><b>${p.name}</b><span class="cars">${p.cars}</span>${p.tag ? `<span class="tag">${p.tag}</span>` : ''}</span>
        <span class="price num">${money(price(k, S.period))}<small>mỗi ${S.period === 'year' ? 'năm' : 'tháng'}</small></span>
        <span class="desc">${p.desc}</span></button>`).join('')}</div>
    </div>
    <div class="ticket gap" id="quote"><div class="tk"><p class="muted small" style="margin:0">Đang tính…</p></div></div>
    <div class="err" id="q-err"></div>
    <button class="btn" id="pay" disabled>Thanh toán</button>`;
  $('#app').querySelectorAll('[data-period]').forEach(b => b.onclick = () => { S.period = b.dataset.period; showChoose(); });
  $('#app').querySelectorAll('[data-plan]').forEach(b => b.onclick = () => { S.plan = b.dataset.plan; showChoose(); });
  $('#pay').onclick = createOrder;
  loadQuote();
}
async function loadQuote() {
  const key = S.plan + S.period;
  try {
    const q = await api('quote', { plan: S.plan, period: S.period });
    if (key !== S.plan + S.period) return;
    S.quote = q;
    const note = { upgrade: q.bonus_days > 0 ? `Đã cộng ${q.bonus_days} ngày đổi từ phần còn lại của gói đang dùng.` : 'Nâng gói có hiệu lực ngay.',
      extend: 'Gia hạn sớm không mất ngày: nối tiếp sau hạn hiện tại.', queue: 'Bắt đầu sau khi gói đang dùng hết hạn.',
      new: D(S.info.trial_end) > Date.now() && S.info.plan !== 'free' ? 'Đổi sang gói này ngay; thời gian trả tiền tính sau ngày hết dùng thử.' : 'Kích hoạt ngay khi nhận tiền.' }[q.mode] || '';
    $('#quote').innerHTML = `<div class="tk">
        <div class="kv"><span>Gói</span><span>${PLANS[q.plan].name} · ${q.period === 'year' ? '1 năm' : '1 tháng'}</span></div>
        <div class="kv"><span>Dùng từ</span><span>${fDate(q.starts_at)}</span></div>
        <div class="kv"><span>Đến hết</span><span>${fDate(q.ends_at)}</span></div>
        <p class="small muted" style="margin:6px 0 0">${note}</p></div>
      <div class="cut"></div>
      <div class="tk"><div class="kv"><span>Số tiền</span><span class="total">${money(q.amount)}</span></div></div>`;
    $('#pay').disabled = false; $('#pay').textContent = `Thanh toán ${money(q.amount)}`;
  } catch (e) { if (handleAuth(e)) return; $('#q-err').textContent = errText(e); }
}
async function createOrder() {
  const b = $('#pay'); b.disabled = true; b.textContent = 'Đang tạo đơn…'; $('#q-err').textContent = '';
  try { S.order = await api('order', { plan: S.plan, period: S.period }); showPay(); }
  catch (e) { if (handleAuth(e)) return; $('#q-err').textContent = errText(e); b.disabled = false; b.textContent = `Thanh toán ${money(S.quote?.amount)}`; }
}

/* ---------- chuyển khoản ---------- */
function qrUrl(amount) {
  const b = S.order.bank;
  return `https://img.vietqr.io/image/${b.bin}-${b.account}-compact2.png?amount=${amount}&addInfo=${encodeURIComponent(S.order.code)}${b.holder ? `&accountName=${encodeURIComponent(noAccent(b.holder))}` : ''}`;
}
function showPay(status) {
  const o = S.order, b = o.bank, missing = status && status.status === 'partial' ? o.amount - status.paid_amount : o.amount;
  const row = (l, v, copy, cls = '') => `<div class="copy"><div style="min-width:0"><div class="l">${l}</div><div class="v ${cls}">${esc(v)}</div></div>${copy ? `<button data-copy="${esc(copy)}">Chép</button>` : ''}</div>`;
  $('#app').innerHTML = `<h1>Chuyển khoản</h1><p class="sub">Gói ${PLANS[o.plan].name} · ${o.period === 'year' ? '1 năm' : '1 tháng'}. Gói kích hoạt ngay khi nhận tiền.</p>
    <div class="ticket gap">
      <div class="tk qr"><img src="${qrUrl(missing)}" alt="Mã QR chuyển khoản ${money(missing)}, nội dung ${esc(o.code)}" width="280" height="280"></div>
      <div class="cut"></div>
      <div class="tk">
        ${row('Ngân hàng', BANKS[b.bin] || b.bin)}
        ${row('Số tài khoản', b.account, b.account)}
        ${b.holder ? row('Chủ tài khoản', b.holder) : ''}
        ${row(status?.status === 'partial' ? 'Số tiền còn thiếu' : 'Số tiền', money(missing), String(missing))}
        ${row('Nội dung chuyển khoản (ghi đúng mã này)', o.code, o.code, 'code')}
      </div>
    </div>
    <div class="card gap">
      <div class="wait" id="wait"><i class="dot wait pulse"></i><span>${status?.status === 'partial' ? `Đã nhận ${money(status.paid_amount)}, còn thiếu ${money(missing)}` : 'Đang chờ chuyển khoản…'}</span></div>
      <ol class="steps" style="margin-top:12px">
        <li>Trên điện thoại này: nhấn giữ mã QR, chọn Lưu vào Ảnh. Mở app ngân hàng, chọn Quét QR rồi chọn ảnh vừa lưu.</li>
        <li>Hoặc chép số tài khoản, số tiền, nội dung rồi dán vào app ngân hàng.</li>
        <li>Giữ trang này mở: có tiền là trang tự báo, thường trong vài giây.</li>
      </ol>
      <p class="small faint" style="margin:10px 0 0">Đơn giữ đến ${fTime(o.expires_at)} ${fDate(o.expires_at)}. Chuyển sau giờ đó vẫn được ghi nhận trong 7 ngày.</p>
    </div>
    <button class="btn line gap" id="back">Chọn gói khác</button>`;
  $('#app').querySelectorAll('[data-copy]').forEach(x => x.onclick = () => copy(x.dataset.copy));
  $('#back').onclick = () => { S.order = null; showChoose(); };
  startPoll();
}
function startPoll() {
  stopPoll();
  S.poll = setInterval(async () => {
    if (document.hidden || !S.order) return;
    try {
      const s = await api('status', { code: S.order.code });
      if (s.status === 'paid') return showDone(s);
      if (s.status === 'partial' && s.paid_amount !== S.lastPaid) { S.lastPaid = s.paid_amount; showPay(s); }
    } catch {}
  }, 3000);
}
function stopPoll() { if (S.poll) clearInterval(S.poll); S.poll = null; }
function showDone(s) {
  stopPoll();
  const until = s.next_until || s.paid_until;
  $('#app').innerHTML = `<div class="card"><div class="done-ic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></div>
    <h1>Đã kích hoạt gói ${PLANS[s.plan].name}</h1>
    <p class="sub">Đã nhận ${money(s.paid_amount)} cho đơn ${esc(s.code)}. Gói dùng đến ${fDate(s.paid_until)}${s.next_plan ? `, sau đó gói ${PLANS[s.next_plan]?.name} đến ${fDate(s.next_until)}` : ''}.</p>
    <p class="sub" style="margin-top:12px">Thư xác nhận đã gửi vào email của bạn.</p>
    <a class="btn gap" href="carrental://activated" style="text-decoration:none">Mở app CarRental</a></div>`;
  // Trên điện thoại: mở app ngay (iPhone hỏi "Mở trong CarRental?"); app tải lại và hiện popup "Đã kích hoạt gói …"
  if (/iPhone|iPad|Android/i.test(navigator.userAgent)) setTimeout(() => { location.href = 'carrental://activated'; }, 900);
}

/* ---------- chung ---------- */
let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }
async function copy(v) { try { await navigator.clipboard.writeText(v); toast('Đã chép'); } catch { toast(v); } }
function handleAuth(e) {
  if (e.message === 'link_expired' || e.message === 'login_required' || e.message === 'Lỗi 401') { S.token = null; S.session = null; ss.set('cr-pay-session', null); showLogin(errText(e)); return true; }
  return false;
}
async function start() {
  $('#app').innerHTML = '<p class="muted">Đang tải…</p>';
  try {
    S.info = await api('info');
    const support = S.info.bank?.support || 'carrental.hotro@gmail.com';
    $('#foot').innerHTML = `Thanh toán bằng chuyển khoản ngân hàng. Cần hỗ trợ hoặc hoàn tiền: <a href="mailto:${esc(support)}">${esc(support)}</a>. Chưa hỗ trợ xuất hoá đơn. <a href="../terms.html">Điều khoản</a> · <a href="../privacy.html">Chính sách bảo mật</a>`;
    if (S.info.locked) return ($('#app').innerHTML = `<div class="card"><h1>Tài khoản đang tạm khoá</h1><p class="sub">Liên hệ ${esc(support)} để được hỗ trợ.</p></div>`);
    const pre = S.info.preset || {}, last = S.info.last || {};
    S.plan = PLANS[pre.plan] ? pre.plan : PLANS[last.plan] ? last.plan : PLANS[S.info.plan] ? S.info.plan : 'basic';
    S.period = pre.period === 'year' || (!pre.period && last.period === 'year') ? 'year' : 'month';
    if (pre.code) {
      const s = await api('status', { code: pre.code }).catch(() => null);
      if (s && s.status === 'paid') return showDone(s);
      if (s && (s.status === 'partial' || s.status === 'pending')) {
        S.order = { code: s.code, plan: s.plan, period: s.period, amount: s.amount, expires_at: s.expires_at, bank: S.info.bank };
        return showPay(s.status === 'partial' ? s : undefined);
      }
    }
    showChoose();
  } catch (e) { if (handleAuth(e)) return; $('#app').innerHTML = `<div class="card"><p>${esc(errText(e))}</p><button class="btn line gap" onclick="start()">Thử lại</button></div>`; }
}
/* ============ Giao diện sáng/tối: nút đổi nhanh, nhớ lựa chọn trên trình duyệt này ============ */
const THEME_ICON = { sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>', moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>' };
const themeDark = () => (document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
function paintTheme() {
  document.querySelectorAll('.theme-btn').forEach(b => {
    const d = themeDark();
    b.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${d ? THEME_ICON.sun : THEME_ICON.moon}</svg>`;
    const label = d ? 'Chuyển sang giao diện sáng' : 'Chuyển sang giao diện tối';
    b.title = label; b.setAttribute('aria-label', label);
  });
}
function toggleTheme() {
  const t = themeDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('cr-theme', t); } catch {}
  paintTheme();
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintTheme);
$('#theme').onclick = toggleTheme;
paintTheme();
if (S.token || S.session) start(); else showLogin();
</script>
</body>
</html>
