<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex">
<title>CarRental Quản trị</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>CarRental Quản trị</title>
<script>/* Giao diện sáng/tối đã chọn (mặc định theo máy): áp trước khi vẽ để không nháy */try{var t=localStorage.getItem('cr-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Bố cục: thanh điều hướng trái cố định + vùng nội dung; điện thoại: thanh điều hướng thành hàng cuộn ngang trên cùng.
   Màu và chữ lấy từ hệ thiết kế của app CarRental (Palette.swift / prototype styles.css). */
:root {
  --canvas: #F4F6FA; --surface: #FFFFFF; --surface-2: #EEF2F7; --surface-3: #E2E8F0;
  --ink: #0F172A; --ink-2: #64748B; --ink-3: #94A3B8; --line: #E6EBF2;
  --primary: #2563EB; --on-primary: #FFFFFF; --accent-2: #DBEAFE; --brand: #0F61F5;
  --s-avail: #16A34A; --s-rent: #2563EB; --s-maint: #D97706; --s-late: #DC2626; --s-done: #94A3B8;
  --c1: #3563E9; --c2: #D99A00; --c3: #8B5CF6; --c4: #0E9F9A; --c0: #CBD5E1;
  --shadow: 0 1px 2px rgba(15,23,42,.04), 0 6px 20px rgba(15,23,42,.05);
  --font: "Manrope", -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r: 16px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --canvas: #0B1120; --surface: #111827; --surface-2: #1E293B; --surface-3: #334155;
  --ink: #F1F5F9; --ink-2: #94A3B8; --ink-3: #64748B; --line: #1E293B;
  --primary: #3B82F6; --accent-2: #1E3A8A;
  --s-avail: #22C55E; --s-rent: #60A5FA; --s-maint: #F59E0B; --s-late: #F87171; --s-done: #64748B;
  --c1: #5B82F0; --c2: #B5850F; --c3: #9277F2; --c4: #1FAAA4; --c0: #475569;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --canvas: #0B1120; --surface: #111827; --surface-2: #1E293B; --surface-3: #334155;
  --ink: #F1F5F9; --ink-2: #94A3B8; --ink-3: #64748B; --line: #1E293B;
  --primary: #3B82F6; --accent-2: #1E3A8A;
  --s-avail: #22C55E; --s-rent: #60A5FA; --s-maint: #F59E0B; --s-late: #F87171; --s-done: #64748B;
  --c1: #5B82F0; --c2: #B5850F; --c3: #9277F2; --c4: #1FAAA4; --c0: #475569;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--canvas); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 8px; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }

/* ---------- khung ---------- */
.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; }
.side { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; display: flex; flex-direction: column; gap: 4px; padding: 20px 14px; border-right: 1px solid var(--line); background: var(--surface); }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
.brand svg { width: 30px; height: auto; color: var(--brand); }
.brand b { font-size: 17px; font-weight: 700; letter-spacing: -.02em; }
.brand b span { color: var(--primary); }
.brand small { display: block; font-size: 11.5px; color: var(--ink-3); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; margin-top: 1px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 11px; height: 40px; padding: 0 12px; border-radius: 12px; color: var(--ink-2); text-decoration: none; font-weight: 600; font-size: 14px; white-space: nowrap; }
.nav a:hover { background: var(--surface-2); color: var(--ink); }
.nav a.on { background: var(--accent-2); color: var(--primary); }
.nav a .badge { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--primary); color: var(--on-primary); font-size: 11.5px; display: grid; place-items: center; }
.side-foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 8px 0; border-top: 1px solid var(--line); }
.av { width: 34px; height: 34px; border-radius: 50%; background: var(--surface-2); color: var(--ink); display: grid; place-items: center; font-weight: 700; font-size: 12.5px; flex: none; }
.side-foot b { display: block; font-size: 13px; }
.side-foot small { color: var(--ink-3); font-size: 12px; }
.main { min-width: 0; padding: 22px 28px 48px; }
.top { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
.top h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -.02em; text-wrap: balance; }
.top .sub { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
.top .grow { flex: 1; min-width: 180px; }
.search { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 12px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); width: min(320px, 100%); color: var(--ink-3); }
.search input { border: 0; outline: 0; background: none; flex: 1; min-width: 0; color: var(--ink); }
.sample { font-size: 12px; font-weight: 600; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); display: inline-block; flex: none; }
.dot.ok { background: var(--s-avail); } .dot.wait { background: var(--s-maint); } .dot.bad { background: var(--s-late); } .dot.info { background: var(--s-rent); }

/* ---------- khối ---------- */
.grid { display: grid; gap: 14px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g2 { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
.g2e { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px; min-width: 0; }
.card h2 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.card-head .muted { font-size: 12.5px; }
.stat .lbl { font-size: 12.5px; color: var(--ink-2); font-weight: 500; }
.stat .val { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin-top: 4px; }
.stat .val small { font-size: 14px; color: var(--ink-3); font-weight: 600; margin-left: 2px; }
.stat .note { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); margin-top: 6px; }
.up { color: var(--s-avail); font-weight: 600; }
.section-gap { margin-top: 14px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { height: 34px; padding: 0 14px; border-radius: 999px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-weight: 600; font-size: 13px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.chip .n { color: var(--ink-3); font-weight: 500; }
.chip.on { background: var(--primary); color: var(--on-primary); box-shadow: none; }
.chip.on .n { color: color-mix(in srgb, var(--on-primary) 65%, transparent); }
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.toolbar .grow { flex: 1; }

/* ---------- bảng ---------- */
.table-wrap { overflow-x: auto; border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow); }
table { width: 100%; border-collapse: collapse; min-width: 760px; }
th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); font-weight: 600; padding: 12px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
td.wrap { white-space: normal; min-width: 200px; }
tr:last-child td { border-bottom: 0; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover { background: color-mix(in srgb, var(--surface-2) 60%, transparent); }
td .t { font-weight: 600; }
td .s { font-size: 12.5px; color: var(--ink-2); }
.r { text-align: right; }
.st { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-2); font-weight: 500; white-space: nowrap; }
.bar-mini { width: 70px; height: 5px; border-radius: 3px; background: var(--surface-2); overflow: hidden; display: inline-block; vertical-align: middle; margin-left: 8px; }
.bar-mini i { display: block; height: 100%; background: var(--primary); border-radius: 3px; }
.bar-mini.over i { background: var(--s-late); }
.empty { padding: 36px 16px; text-align: center; color: var(--ink-2); }

/* ---------- biểu đồ ---------- */
.chart { position: relative; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart .tick { font-size: 11px; fill: var(--ink-3); font-family: var(--font); }
.chart .lab { font-size: 11.5px; fill: var(--ink-2); font-weight: 600; font-family: var(--font); }
.chart .grid-l { stroke: var(--line); stroke-width: 1; }
.chart .col { fill: var(--c1); transition: opacity .15s; }
.chart .col.dim { opacity: .35; }
.chart .hit { fill: transparent; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 12px; font-weight: 600; padding: 6px 9px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -100%); margin-top: -8px; }
.tip small { display: block; font-weight: 500; opacity: .75; }
.stack { display: flex; gap: 2px; height: 14px; border-radius: 7px; overflow: hidden; }
.stack i { display: block; height: 100%; }
.legend { display: grid; gap: 8px; margin-top: 14px; }
.legend div { display: flex; align-items: center; gap: 9px; font-size: 13px; }
.legend .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.legend .v { margin-left: auto; font-weight: 600; }
.legend .p { width: 42px; text-align: right; color: var(--ink-3); font-size: 12.5px; }

/* ---------- danh sách nhỏ ---------- */
.rows { display: grid; }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; padding-top: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-weight: 600; font-size: 13.5px; }
.row .s { font-size: 12.5px; color: var(--ink-2); }
.ellip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.link { color: var(--primary); font-weight: 600; font-size: 13px; }

/* ---------- nút, ô nhập ---------- */
.btn { height: 38px; padding: 0 16px; border-radius: 12px; font-weight: 600; font-size: 13.5px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap; }
.btn.primary { background: var(--primary); color: var(--on-primary); }
.btn.line { box-shadow: inset 0 0 0 1px var(--surface-3); background: var(--surface); }
.btn.danger { color: var(--s-late); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--s-late) 35%, transparent); background: var(--surface); }
.btn.danger.arm { background: var(--s-late); color: #fff; box-shadow: none; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.sm { height: 32px; padding: 0 12px; font-size: 12.5px; border-radius: 10px; }
.field { display: grid; gap: 6px; }
.field label { font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
.input { height: 40px; border-radius: 12px; border: 0; box-shadow: inset 0 0 0 1px var(--surface-3); background: var(--surface); padding: 0 12px; outline: none; width: 100%; min-width: 0; }
textarea.input { height: auto; min-height: 90px; padding: 10px 12px; resize: vertical; line-height: 1.5; }
.input:focus { box-shadow: inset 0 0 0 1.5px var(--primary); }
.input.money { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.form { display: grid; gap: 14px; }
.cb { width: 18px; height: 18px; accent-color: var(--primary); }

/* ---------- ngăn chi tiết chủ xe ---------- */
.scrim { position: fixed; inset: 0; background: rgba(8,10,9,.36); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--canvas); z-index: 41; overflow-y: auto; padding: calc(env(safe-area-inset-top, 0px) + 18px) 20px calc(env(safe-area-inset-bottom, 0px) + 28px); box-shadow: -12px 0 40px rgba(15,23,42,.18); animation: slidein .28s cubic-bezier(.2,.85,.25,1); }
@keyframes slidein { from { transform: translateX(40px); opacity: 0; } }
.dr-top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.dr-top .av { width: 46px; height: 46px; font-size: 15px; background: var(--surface); box-shadow: var(--shadow); }
.dr-top h2 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); box-shadow: var(--shadow); flex: none; }
.dr h3 { margin: 20px 0 8px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; font-size: 13.5px; }
.kv span:first-child { color: var(--ink-2); }
.kv span:last-child { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.kv .st { font-weight: 500; }
.ticket { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); }
.tk-sec { padding: 10px 16px; }
.tk-cut { position: relative; height: 0; margin: 4px 16px; border-top: 1.5px dashed color-mix(in srgb, var(--ink-3) 55%, transparent); }
.tk-cut::before, .tk-cut::after { content: ""; position: absolute; top: -12px; width: 22px; height: 22px; border-radius: 50%; background: var(--canvas); }
.tk-cut::before { left: -28px; } .tk-cut::after { right: -28px; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; }
.note-privacy { font-size: 12px; color: var(--ink-3); margin-top: 18px; line-height: 1.5; }

/* ---------- hỗ trợ ---------- */
.inbox { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 14px; align-items: start; }
.tk-list { padding: 6px; }
.tk-item { display: block; width: 100%; text-align: left; padding: 12px; border-radius: 12px; }
.tk-item + .tk-item { margin-top: 2px; }
.tk-item.on { background: var(--surface-2); }
.tk-item .t { font-weight: 600; font-size: 13.5px; }
.tk-item .s { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }
.tk-item .meta { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; font-size: 12px; color: var(--ink-3); }
.msg { max-width: 82%; padding: 10px 12px; border-radius: 14px; font-size: 13.5px; line-height: 1.5; background: var(--surface-2); }
.msg.me { margin-left: auto; background: var(--accent-2); }
.msg small { display: block; font-size: 11.5px; color: var(--ink-3); margin-top: 4px; }
.thread { display: grid; gap: 10px; margin: 14px 0; }

/* ---------- thông báo ---------- */
.push-pv { border-radius: 18px; padding: 12px 14px; background: color-mix(in srgb, var(--surface-2) 80%, transparent); display: flex; gap: 10px; }
.push-pv .ic { width: 38px; height: 38px; border-radius: 9px; background: var(--brand); display: grid; place-items: center; flex: none; }
.push-pv .ic svg { width: 24px; color: #fff; }
.push-pv b { font-size: 13.5px; }
.push-pv p { margin: 2px 0 0; font-size: 13px; color: var(--ink-2); }

/* ---------- hệ thống ---------- */
.feats { list-style: none; margin: 14px 0 0; padding: 12px 0 0; border-top: 1px solid var(--line); display: grid; gap: 7px; font-size: 13px; color: var(--ink-2); }
.feats li { display: flex; gap: 8px; align-items: flex-start; }
.feats svg { width: 16px; height: 16px; color: var(--ink-3); margin-top: 1px; }
.meter { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; margin-top: 10px; }
.meter i { display: block; height: 100%; background: var(--primary); border-radius: 4px; }

.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translate(-50%, 20px); opacity: 0; background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 13.5px; display: flex; align-items: center; gap: 8px; z-index: 60; transition: .25s; max-width: calc(100% - 32px); pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g2 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 760px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: auto; flex-direction: row; align-items: center; padding: 10px 16px; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; gap: 10px; }
  .brand { padding: 0 8px 0 0; } .brand small { display: none; } .brand b { display: none; }
  .nav { flex-direction: row; } .nav a { height: 36px; padding: 0 12px; }
  .nav a svg { display: none; }
  .side-foot { display: none; }
  .main { padding: 18px 16px 40px; }
  .g2e, .inbox { grid-template-columns: minmax(0, 1fr); }
  .stat .val { font-size: 22px; }
  .top h1 { font-size: 21px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- nút sáng/tối ---------- */
.theme-btn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); box-shadow: var(--shadow); color: var(--ink-2); flex: none; cursor: pointer; }
.theme-btn:hover { color: var(--ink); }
.theme-btn svg { width: 18px; height: 18px; color: inherit; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- đăng nhập ---------- */
.pw { position: relative; }
.pw .input { padding-right: 46px; }
.pw-eye { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; color: var(--ink-3); background: none; border: 0; cursor: pointer; }
.pw-eye:hover { color: var(--ink-2); }
.pw-eye svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

[hidden] { display: none !important; }
.login { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px 16px; background: var(--canvas); overflow-y: auto; }
.login-card { width: min(380px, 100%); background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 26px 22px 22px; }
.login-card h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
.login-err { color: var(--s-late); font-size: 13px; min-height: 18px; }
.login-alt { margin: 16px 0 0; font-size: 13px; color: var(--ink-2); text-align: center; }
.login-alt .link { font-size: 13px; }
button.sample { cursor: pointer; height: 34px; padding: 0 10px; border-radius: 10px; }
button.sample:hover { background: var(--surface-2); }
button.sample svg { width: 14px; height: 14px; }
.side-foot .icon-btn { width: 32px; height: 32px; color: var(--ink-2); }
</style>

/* Gọi Supabase Auth (đăng nhập, gửi mã, xác nhận mã, đặt mật khẩu) */
async function authFetch(path, method, body, bearer) {
  let r;
  try { r = await fetch(`${SB_URL}/auth/v1/${path}`, { method, headers: { apikey: SB_KEY, 'Content-Type': 'application/json', ...(bearer ? { Authorization: `Bearer ${bearer}` } : {}) }, body: JSON.stringify(body) }); }
  catch { throw new ApiError('network'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new ApiError(j.error_code || j.error || j.msg || 'invalid_credentials');
  return j;
}
function setSession(j) {
  session = { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: j.expires_at || Math.floor(Date.now() / 1000) + j.expires_in, email: j.user?.email };
  store.set('cr-admin-session', session);
}
async function authCall(grant, body) { setSession(await authFetch(`token?grant_type=${grant}`, 'POST', body)); }
async function token() {
  if (!session) throw new ApiError('login');
  if (Date.now() / 1000 > session.expires_at - 60) {
    try { await authCall('refresh_token', { refresh_token: session.refresh_token }); }
    catch (e) { if (e.message !== 'network') signOutLocal(); throw e; }
  }
  return session.access_token;
}
async function rpc(name, params = {}) {
  if (DEMO) return demoRpc(name, params);
  let r;
  try { r = await fetch(`${SB_URL}/rest/v1/rpc/${name}`, { method: 'POST', headers: { apikey: SB_KEY, Authorization: `Bearer ${await token()}`, 'Content-Type': 'application/json' }, body: JSON.stringify(params) }); }
  catch (e) { throw e instanceof ApiError ? e : new ApiError('network'); }
  const text = await r.text();
  const j = text ? (() => { try { return JSON.parse(text); } catch { return text; } })() : null;
  if (r.status === 401) { signOutLocal(); throw new ApiError('login'); }
  if (!r.ok) throw new ApiError(j?.message || `Lỗi ${r.status}`);
  return j;
}
function signOutLocal() { session = null; store.set('cr-admin-session', null); showLogin(); }
async function signOut() {
  if (session && !DEMO) fetch(`${SB_URL}/auth/v1/logout`, { method: 'POST', headers: { apikey: SB_KEY, Authorization: `Bearer ${session.access_token}` } }).catch(() => {});
  signOutLocal();
}

/* ============ Biểu đồ cột (vẽ theo bề rộng thật của khung, có chú thích khi rê chuột) ============ */
function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v || 1))); const n = v / p; return [1, 1.2, 1.6, 2, 2.4, 3.2, 4, 6, 8, 10].find(x => n <= x) * p; }
function columns(el, data, fmt, opts = {}) {
  if (!el) return;
  const W = el.clientWidth || 600, H = opts.h || 220, padL = 44, padB = 26, padT = 18;
  const top = Math.max(1, ...data.map(d => d.v)) * 1.08;
  const max = opts.integer ? Math.max(4, Math.ceil(top / 4) * 4) : niceMax(top), n = data.length;
  const band = (W - padL) / n, bw = Math.min(24, band * 0.62);
  const y = v => padT + (H - padT - padB) * (1 - v / max);
  const ticks = [0, .25, .5, .75, 1].map(t => t * max);
  const every = Math.ceil(n / Math.max(1, Math.floor((W - padL) / 46)));
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(opts.label || '')}">`;
  s += ticks.map(t => `<line class="grid-l" x1="${padL}" x2="${W}" y1="${y(t)}" y2="${y(t)}"/><text class="tick" x="${padL - 8}" y="${y(t) + 4}" text-anchor="end">${fmt(t, true)}</text>`).join('');
  data.forEach((d, i) => {
    const cx = padL + band * i + band / 2, tp = y(d.v), h = H - padB - tp, r = Math.max(0, Math.min(4, h, bw / 2));
    const x0 = cx - bw / 2, base = H - padB;
    const path = h <= 0 ? '' : `M${x0},${base} L${x0},${tp + r} Q${x0},${tp} ${x0 + r},${tp} L${x0 + bw - r},${tp} Q${x0 + bw},${tp} ${x0 + bw},${tp + r} L${x0 + bw},${base} Z`;
    s += `<path class="col" d="${path}" data-i="${i}"/>`;
    if (i % every === 0 || i === n - 1) s += `<text class="tick" x="${cx}" y="${H - 8}" text-anchor="middle">${d.x}</text>`;
    s += `<rect class="hit" x="${padL + band * i}" y="${padT}" width="${band}" height="${H - padT - padB}" data-i="${i}"/>`;
  });
  const last = data[n - 1];
  if (opts.endLabel !== false && last && last.v > 0) s += `<text class="lab" x="${padL + band * (n - 1) + band / 2}" y="${y(last.v) - 7}" text-anchor="end">${fmt(last.v)}</text>`;
  s += '</svg><div class="tip" hidden></div>';
  el.innerHTML = s;
  const tip = $('.tip', el);
  $$('.hit', el).forEach(r => {
    const show = () => {
      const i = +r.dataset.i, d = data[i];
      $$('.col', el).forEach(c => c.classList.toggle('dim', c.dataset.i !== String(i)));
      tip.innerHTML = `${fmt(d.v)}<small>${d.full || d.x}</small>`; tip.hidden = false;
      tip.style.left = (padL + band * i + band / 2) / W * 100 + '%'; tip.style.top = y(d.v) + 'px';
    };
    r.addEventListener('mouseenter', show); r.addEventListener('click', show);
    r.addEventListener('mouseleave', () => { tip.hidden = true; $$('.col', el).forEach(c => c.classList.remove('dim')); });
  });
}

PAGES['he-thong'] = {

let armed = null;
/* Bấm hai lần để chắc chắn (trang không dùng hộp xác nhận của trình duyệt) */
function confirmTwice(el, text) {
  if (armed === el) { armed = null; return true; }
  armed = el; el.classList.add('arm'); const label = el.querySelector('span') || el; label.dataset.orig = label.textContent; label.textContent = text;
  setTimeout(() => { if (armed === el) { armed = null; el.classList.remove('arm'); label.textContent = label.dataset.orig; } }, 3000);
  return false;
}
/* Chạy thao tác, báo kết quả, bỏ dữ liệu cũ của các trang liên quan rồi vẽ lại */

  try {
    const r = await fn();

    if (ok) toast(typeof ok === 'function' ? ok(r) : ok);
    if (UI.drawer && stale.includes('owner')) await openDrawer(UI.drawer);
    after && after(r);
    await render();
  } catch (e) { toast(errText(e)); }
}

/* ============ Điều hướng, sự kiện ============ */
let renderSeq = 0;
async function render(force) {
  const pg = PAGES[UI.route], seq = ++renderSeq;
  const badge = k => (DATA.badges?.[k] ? `<span class="badge num">${DATA.badges[k]}</span>` : '');
  const nav = () => { $('#nav').innerHTML = ROUTES.map(([k, l, i]) => `<a href="#${k}" class="${k === UI.route ? 'on' : ''}" ${k === UI.route ? 'aria-current="page"' : ''}>${ic(i)}${l}${badge(k)}</a>`).join(''); };
  nav();
  $('#title').textContent = pg.title;
  document.title = `${pg.title} · CarRental Quản trị`;
  if ((NEEDS[UI.route] || []).some(([k]) => DATA[k] === undefined) || force) $('#page').innerHTML = '<div class="empty">Đang tải…</div>';
  try {
    const t0 = performance.now();
    await ensure(UI.route, force);
    if (UI.route === 'he-thong') UI.latency = Math.round(performance.now() - t0);
  } catch (e) {
    if (e.message === 'login') return;
    if (seq === renderSeq) $('#page').innerHTML = `<section class="card"><div class="empty">${esc(errText(e))}<div style="margin-top:12px"><button class="btn line" data-act="reload">Thử lại</button></div></div></section>`;
    return;
  }
  if (seq !== renderSeq) return;
  nav();
  $('#subtitle').textContent = pg.sub();
  $('#data-state').innerHTML = DEMO ? '<i class="dot wait"></i>Dữ liệu mẫu' : `<i class="dot ok"></i>Dữ liệu thật · ${fTime(loadedAt.last || new Date())}${ic('reset')}`;
  UI.redraw = null;
  $('#page').innerHTML = pg.render();
  pg.mount && pg.mount();
}
function go() { const r = (location.hash || '').replace(/^#/, '').split('&')[0]; UI.route = PAGES[r] ? r : 'tong-quan'; UI.assign = null; closeDrawer(); render(); window.scrollTo(0, 0); }
window.addEventListener('hashchange', go);
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => UI.redraw && UI.redraw(), 120); });
document.addEventListener('click', e => {
  const t = e.target.closest('[data-owner],[data-act],[data-filter],[data-pay],[data-paytab],[data-ticket],[data-assign],[data-go]');
  if (!t) return;
  if (t.dataset.act) return ACT[t.dataset.act](t.dataset.arg, t);
  if (t.dataset.owner) return openDrawer(t.dataset.owner);
  if (t.dataset.go) { location.hash = t.dataset.go + (DEMO ? '&demo' : ''); return; }
  if (t.dataset.filter) { UI.ownerFilter = t.dataset.filter; return render(); }
  if (t.dataset.paytab) { UI.payTab = t.dataset.paytab; UI.payFilter = 'all'; UI.assign = null; return render(); }
  if (t.dataset.pay) { UI.payFilter = t.dataset.pay; return render(); }
  if (t.dataset.ticket) { UI.ticket = t.dataset.ticket; return render(); }
  if (t.dataset.assign) { UI.assign = { tx: +t.dataset.assign, q: '', list: [], loading: true }; render(); return findOrders(''); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && UI.drawer) closeDrawer(); });

const EYE = { show: '<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>', hide: '<path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/>' };
function eyeify(root = document) {
  root.querySelectorAll('input[type="password"]:not([data-eye])').forEach(inp => {
    inp.dataset.eye = '1';
    const wrap = document.createElement('div'); wrap.className = 'pw';
    inp.replaceWith(wrap); wrap.appendChild(inp);
    const b = document.createElement('button'); b.type = 'button'; b.className = 'pw-eye';
    const paint = () => { const shown = inp.type === 'text'; b.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${shown ? EYE.hide : EYE.show}</svg>`;
      b.setAttribute('aria-label', shown ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'); b.title = b.getAttribute('aria-label'); };
